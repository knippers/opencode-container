services:
  opencode:
    image: danielknippers/opencode-container:latest
    container_name: opencode
    restart: unless-stopped
    ports:
      - "4096:4096"
      - "1080:1080"
    volumes:
      - ./config:/home/opencode/.config/opencode
      - ./studio:/home/opencode/.config/opencode-studio
      - ./profiles:/home/opencode/.config/opencode-profiles
      - ./data:/home/opencode/.local/share
      - ./workspace:/workspace
    working_dir: /workspace
